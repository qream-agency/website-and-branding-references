<style>
/* Layout: sticky filter panel — collection tabs | divider | 3 unlabelled chip rows — over a 4-column reference grid */
:root{
  --bg:#ffffff;
  --panel:#efefef;
  --fg:#1c1c1c;
  --muted:#6b6b6b;
  --line:#c9c9c9;
  --divider:#b9b9b9;
  --chip-on-bg:#111111;
  --chip-on-fg:#ffffff;
  --thumb:#8a8a8a;
  --hl:#111111;
  --font:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141414;--panel:#1f1f1f;--fg:#ececec;--muted:#9a9a9a;--line:#3d3d3d;--divider:#444;
  --chip-on-bg:#f2f2f2;--chip-on-fg:#111111;--thumb:#2a2a2a;--hl:#ffffff;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141414;--panel:#1f1f1f;--fg:#ececec;--muted:#9a9a9a;--line:#3d3d3d;--divider:#444;
  --chip-on-bg:#f2f2f2;--chip-on-fg:#111111;--thumb:#2a2a2a;--hl:#ffffff;color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}

.filters{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);
  display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:28px;
  padding-block:22px 26px;padding-left:max(40px,env(safe-area-inset-left,0px));padding-right:max(40px,env(safe-area-inset-right,0px))}
.tabs{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding-right:28px;border-right:1px solid var(--divider)}
.rows{display:flex;flex-direction:column;gap:10px;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.chip,.tab,.clear{appearance:none;font:inherit;font-size:14px;line-height:1;color:var(--fg);background:transparent;
  border:1px solid var(--fg);border-radius:999px;padding:9px 16px;cursor:pointer;white-space:nowrap;
  transition:background .15s,color .15s,border-color .15s}
.chip:hover,.tab:hover,.clear:hover{background:color-mix(in srgb,var(--fg) 7%,transparent)}
.chip[aria-pressed="true"],.tab[aria-selected="true"]{background:var(--chip-on-bg);color:var(--chip-on-fg);border-color:var(--chip-on-bg)}
.tab{min-width:92px;text-align:center}
.chip:focus-visible,.tab:focus-visible,.clear:focus-visible,.card:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
.chip .n{font-family:var(--mono);font-size:10.5px;opacity:.5;margin-left:6px;font-variant-numeric:tabular-nums}
.chip[disabled]{opacity:.3;cursor:default}
.chip[disabled]:hover{background:transparent}
.trow{display:flex;align-items:center;gap:16px;justify-content:space-between}
.clear{flex:none}
.clear[disabled]{opacity:.35;cursor:default}
.clear[disabled]:hover{background:transparent}

main{padding-block:28px 64px;padding-left:max(40px,env(safe-area-inset-left,0px));padding-right:max(40px,env(safe-area-inset-right,0px))}
.status{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.02em;margin:0 0 20px;font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));column-gap:38px;row-gap:38px}
.card{display:block;color:inherit;text-decoration:none;min-width:0}
.thumb{position:relative;aspect-ratio:1228/668;max-width:100%;background:var(--thumb);overflow:hidden}
.thumb img,.thumb video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;
  transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.card:hover .thumb img,.card:hover .thumb video{transform:scale(1.03)}
.badge{position:absolute;top:10px;left:10px;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
  background:rgba(0,0,0,.55);color:#fff;padding:4px 7px;border-radius:3px;backdrop-filter:blur(4px)}
.open{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:50%;background:#fff;color:#111;
  display:grid;place-items:center;opacity:0;transform:translateY(-4px);transition:opacity .2s,transform .2s}
.card:hover .open,.card:focus-visible .open{opacity:1;transform:none}
.meta{padding-top:12px}
.name{font-weight:600;font-size:17px;line-height:1.25;margin:0;display:flex;gap:8px;align-items:baseline;min-width:0}
.name>span:first-child{flex:none;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.domain{min-width:0;font-family:var(--mono);font-size:11.5px;color:var(--muted);font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tags{display:flex;flex-wrap:wrap;gap:3px 9px;margin-top:5px;font-size:13px;color:var(--muted)}
.tags .on{color:var(--hl);text-decoration:underline;text-underline-offset:3px}
.empty{padding:80px 0;text-align:center;color:var(--muted)}
.empty button{margin-top:16px}

@media (max-width:1200px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));column-gap:28px}}
@media (max-width:860px){
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));column-gap:20px;row-gap:28px}
  .filters,main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .filters{position:static;grid-template-columns:minmax(0,1fr);row-gap:14px;padding-block:16px 18px}
  .tabs{flex-direction:row;padding-right:0;border-right:0;padding-bottom:14px;border-bottom:1px solid var(--divider)}
  .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));padding-right:16px}
  .chips::-webkit-scrollbar{display:none}
  .trow{flex-direction:column;align-items:stretch;gap:10px}
  .clear{align-self:flex-start}
}
@media (max-width:520px){.grid{grid-template-columns:minmax(0,1fr)}}
@media (prefers-reduced-motion:reduce){.thumb img,.thumb video,.open,.chip,.tab{transition:none}}
</style>

</head>

<section class="filters" aria-label="Filters">
  <div class="tabs" role="tablist" aria-label="Collection">
    <button class="tab" role="tab" id="tab-website" data-mode="website" type="button">Website</button>
    <button class="tab" role="tab" id="tab-branding" data-mode="branding" type="button">Branding</button>
  </div>
  <div class="rows">

    <div class="chips" role="group" aria-label="Style" data-group="style"></div>
    <div class="trow"><div class="chips" role="group" aria-label="Type" data-group="type"></div>
      <button class="clear" id="clear" type="button">Clear all filters</button></div>
  </div>
</section>

<main>
  <p class="status" id="status" aria-live="polite"></p>
  <div class="grid" id="grid" role="tabpanel"></div>
  <div class="empty" id="empty" hidden>
    <div>Nothing matches all selected filters.</div>
    <button class="clear" id="clear2" type="button">Clear all filters</button>
  </div>
</main>

 {id:"truf",name:"Truf",url:"https://www.behance.net/gallery/242695577/Truf",t:["Cyber security","AI","Dark Colors","Bold","Futuristic","Software","SaaS"]},
 {id:"sira",name:"Sira",url:"https://www.behance.net/gallery/246567207/Sira-Brand-Identity",t:["Technology","AI","Bright colors","Futuristic","SaaS","Software"]},
 {id:"agromonti",name:"Agromonti",url:"https://www.behance.net/gallery/246160993/Agromonti",t:["Finance","Bold","Dark Colors","Bright colors","Service","Business"]},
 {id:"orbital-voltaics",name:"Orbital Voltaics",url:"https://www.behance.net/gallery/206276593/Orbital-Voltaics-Brand-Identity",t:["Technology","Futuristic","Bold","Hardware"]},
 {id:"radiance",name:"Radiance",url:"https://www.behance.net/gallery/253945001/Radiance",t:["Finance","3D","Light Colors","Elegant","Business"]},
 {id:"foremark",name:"Foremark",url:"https://www.behance.net/gallery/244152659/Foremark",t:["Corporate","3D","Bold","Bright colors","Service","Business"]},
 {id:"the-kleen-team",name:"The Kleen Team",url:"https://www.behance.net/gallery/239339443/The-Kleen-Team",t:["Corporate","Clean","Elegant","Dark Colors","Service"]},
 {id:"aperture-capital",name:"Aperture Capital",url:"https://www.behance.net/gallery/249315433/Aperture-Capital-Brand-Identity",t:["Finance","Bold","Bright colors","Business"]},
 {id:"centora-ventures",name:"Centora Ventures",url:"https://www.behance.net/gallery/236784355/Centora-Ventures-Brand-Identity",t:["Finance","Technology","Elegant","Bold","Business"]}
];

const COLLECTIONS = {
  website:  {items: SITES,  dir: "media/",       noun: "sites"},
  branding: {items: BRANDS, dir: "media/brand/", noun: "branding cases"}
};
const GROUP_OF = {};
for (const g in TAGS) TAGS[g].forEach(x => GROUP_OF[x] = g);
const ORDER = [...TAGS.type, ...TAGS.style, ...TAGS.industry];
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const host = u => u.replace(/^https?:\/\/(www\.)?/,"").split("/")[0];
const newSel = () => ({industry:new Set(), style:new Set(), type:new Set()});
const sel = {website:newSel(), branding:newSel()};
let mode = "website";

// tags that actually occur in each collection
for (const k in COLLECTIONS) {
  const used = new Set(); COLLECTIONS[k].items.forEach(s => s.t.forEach(x => used.add(x)));
  COLLECTIONS[k].used = used;
}

// restore remembered state
try {
  const st = JSON.parse(localStorage.getItem("wc-state")||"{}");
  if (st.mode in COLLECTIONS) mode = st.mode;
  for (const k in sel) for (const g in sel[k]) (st[k]?.[g]||[]).forEach(x => TAGS[g].includes(x) && sel[k][g].add(x));
} catch(e){}
if (location.hash === "#branding") mode = "branding";
if (location.hash === "#website") mode = "website";
function save(){ try{
  const o = {mode}; for (const k in sel) o[k] = Object.fromEntries(Object.entries(sel[k]).map(([g,s])=>[g,[...s]]));
  localStorage.setItem("wc-state", JSON.stringify(o)); }catch(e){} }

// match: OR inside a group, AND across groups
function matches(item, s){
  for (const g in s) { if (s[g].size && !item.t.some(x => s[g].has(x))) return false; }
  return true;
}

// chips
for (const g in TAGS) {
  const box = document.querySelector(`[data-group="${g}"]`);
  TAGS[g].forEach(tag => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "chip"; b.dataset.tag = tag; b.dataset.group = g;
    b.innerHTML = `${tag}<span class="n"></span>`;
    b.addEventListener("click", () => { const s = sel[mode][g]; s.has(tag) ? s.delete(tag) : s.add(tag); update(); });
    box.appendChild(b);
  });
}

// cards
const grid = document.getElementById("grid");
const io = "IntersectionObserver" in window ? new IntersectionObserver(es => es.forEach(e => {
  const v = e.target;
  if (e.isIntersecting) { if (!v.src) v.src = v.dataset.src; v.play().catch(()=>{}); } else v.pause();
}), {rootMargin:"200px 0px"}) : null;

const cards = [];
for (const k in COLLECTIONS) {
  const {items, dir} = COLLECTIONS[k];
  items.forEach(s => {
    s.t.sort((a,b) => ORDER.indexOf(a) - ORDER.indexOf(b));
    const a = document.createElement("a");
    a.className = "card"; a.href = s.url; a.target = "_blank"; a.rel = "noopener noreferrer"; a.hidden = true;
    a.setAttribute("aria-label", `${s.name}, opens ${host(s.url)} in a new tab`);
    const media = s.v && !reduce
      ? `<video muted loop playsinline preload="none" poster="${dir}${s.id}.jpg" data-src="${dir}${s.id}.mp4" aria-hidden="true"></video>`
      : `<img src="${dir}${s.id}.jpg" alt="" loading="lazy" decoding="async">`;
    a.innerHTML = `<div class="thumb">${media}${s.v?'<span class="badge">Video</span>':''}
        <span class="open" aria-hidden="true"><svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M3 9L9 3M4 3h5v5" stroke="currentColor" stroke-width="1.4"/></svg></span></div>
      <div class="meta"><p class="name"><span>${s.name}</span><span class="domain">${host(s.url)}</span></p>
      <div class="tags">${s.t.map(x=>`<span data-tag="${x}">${x}</span>`).join("")}</div></div>`;
    grid.appendChild(a);
    const v = a.querySelector("video");
    if (v) v.addEventListener("error", () => { const img = new Image(); img.src = `${dir}${s.id}.jpg`; img.alt = ""; io && io.unobserve(v); v.replaceWith(img); }, true);
    if (v && io) io.observe(v);
    cards.push({k, s, el:a});
  });
}

// tabs
const tabs = [...document.querySelectorAll(".tab")];
tabs.forEach(t => t.addEventListener("click", () => { mode = t.dataset.mode; update(); }));
document.querySelector(".tabs").addEventListener("keydown", e => {
  if (!["ArrowDown","ArrowUp","ArrowLeft","ArrowRight"].includes(e.key)) return;
  e.preventDefault(); mode = mode === "website" ? "branding" : "website"; update();
  document.getElementById("tab-"+mode).focus();
});

function update(){
  const col = COLLECTIONS[mode], s = sel[mode];
  tabs.forEach(t => { const on = t.dataset.mode === mode; t.setAttribute("aria-selected", on); t.tabIndex = on ? 0 : -1; });
  grid.setAttribute("aria-labelledby", "tab-"+mode);
  let shown = 0;
  cards.forEach(({k, s:item, el}) => {
    const ok = k === mode && matches(item, s); el.hidden = !ok; if (ok) shown++;
    if (k === mode) el.querySelectorAll(".tags span").forEach(t => t.classList.toggle("on", s[GROUP_OF[t.dataset.tag]]?.has(t.dataset.tag)));
  });
  // chips: only tags this collection uses; count = results if this chip were added
  document.querySelectorAll(".chip").forEach(b => {
    const g = b.dataset.group, tag = b.dataset.tag, on = s[g].has(tag);
    b.hidden = !col.used.has(tag);
    b.setAttribute("aria-pressed", on);
    const trial = {...s, [g]: new Set(on ? s[g] : [...s[g], tag])};
    const n = col.items.filter(it => matches(it, trial) && it.t.includes(tag)).length;
    b.querySelector(".n").textContent = n;
    b.disabled = !on && n === 0;
  });
  const any = Object.values(s).some(x => x.size);
  document.getElementById("clear").disabled = !any;
  document.getElementById("empty").hidden = shown > 0;
  document.getElementById("status").textContent = any ? `${shown} of ${col.items.length} ${col.noun}` : `${col.items.length} ${col.noun}`;
  save();
}
const clearAll = () => { Object.values(sel[mode]).forEach(x => x.clear()); update(); };
document.getElementById("clear").addEventListener("click", clearAll);
document.getElementById("clear2").addEventListener("click", clearAll);
update();
</script>
</body>
